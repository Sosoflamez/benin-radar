{% extends "dashboard/base.html" %}

{% block title %}Connexion — Bénin Radar{% endblock %}

{% block content %}
<div class="mx-auto flex min-h-[calc(100vh-73px)] max-w-md flex-col justify-center px-4 py-12 sm:px-6">
  <h1 class="mb-1 font-display text-3xl font-extrabold uppercase tracking-wide">Connexion</h1>
  <p class="mb-8 font-mono text-xs uppercase tracking-wider text-zinc-500 dark:text-zinc-400">
    Accès réservé aux agents habilités
  </p>

  <form method="post" class="space-y-5 rounded-xl border border-zinc-200 bg-white p-6 shadow-sm dark:border-zinc-800 dark:bg-zinc-900/60">
    {% csrf_token %}

    {% if form.errors %}
      <p class="rounded-lg border border-radar-rose/40 bg-radar-rose/10 px-3 py-2 text-sm text-radar-rose">
        Identifiants invalides. Réessayez.
      </p>
    {% endif %}

    <div>
      <label for="{{ form.username.id_for_label }}" class="mb-1 block font-mono text-xs uppercase tracking-wider text-zinc-500 dark:text-zinc-400">
        Identifiant
      </label>
      <input
        type="text"
        name="{{ form.username.html_name }}"
        id="{{ form.username.id_for_label }}"
        autofocus
        required
        class="w-full rounded-lg border border-zinc-300 bg-transparent px-3 py-2 text-sm outline-none focus:border-radar-amber focus:ring-1 focus:ring-radar-amber dark:border-zinc-700"
      >
    </div>

    <div>
      <label for="{{ form.password.id_for_label }}" class="mb-1 block font-mono text-xs uppercase tracking-wider text-zinc-500 dark:text-zinc-400">
        Mot de passe
      </label>
      <input
        type="password"
        name="{{ form.password.html_name }}"
        id="{{ form.password.id_for_label }}"
        required
        class="w-full rounded-lg border border-zinc-300 bg-transparent px-3 py-2 text-sm outline-none focus:border-radar-amber focus:ring-1 focus:ring-radar-amber dark:border-zinc-700"
      >
    </div>

    <input type="hidden" name="next" value="{{ next }}">

    <button
      type="submit"
      class="w-full rounded-lg bg-zinc-900 px-4 py-2.5 font-mono text-xs font-semibold uppercase tracking-wider text-white transition hover:bg-radar-amber hover:text-zinc-900 dark:bg-zinc-100 dark:text-zinc-900 dark:hover:bg-radar-amber"
    >
      Se connecter
    </button>
  </form>
</div>
{% endblock %}
