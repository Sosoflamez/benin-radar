{% extends "dashboard/base.html" %}

{% block title %}Infractions — Bénin Radar{% endblock %}

{% block content %}
<div class="mx-auto max-w-6xl px-4 py-8 sm:px-6 lg:px-8" x-data="infractionsTable()">
  <div class="mb-6 flex flex-wrap items-end justify-between gap-4">
    <div>
      <h1 class="font-display text-4xl font-extrabold uppercase tracking-wide">Infractions</h1>
      <p class="mt-1 font-mono text-xs uppercase tracking-wider text-zinc-500 dark:text-zinc-400">
        Contrôle vitesse — flux en direct
      </p>
    </div>
    <div
      class="flex items-center gap-2 rounded-full border px-3 py-1.5 text-xs font-mono uppercase tracking-wider"
      :class="statusClasses()"
    >
      <span class="relative flex h-2 w-2">
        <span
          class="absolute inline-flex h-full w-full rounded-full opacity-75"
          :class="wsStatus === 'open' ? 'animate-ping bg-radar-emerald' : ''"
        ></span>
        <span class="relative inline-flex h-2 w-2 rounded-full" :class="statusDot()"></span>
      </span>
      <span x-text="statusLabel()"></span>
    </div>
  </div>

  <div class="overflow-hidden rounded-xl border border-zinc-200 bg-white shadow-sm dark:border-zinc-800 dark:bg-zinc-900/60">
    <table class="w-full text-left text-sm">
      <thead class="border-b border-zinc-200 bg-zinc-50 font-mono text-xs uppercase tracking-wider text-zinc-500 dark:border-zinc-800 dark:bg-zinc-950/50 dark:text-zinc-400">
        <tr>
          <th class="px-4 py-3">Horodatage</th>
          <th class="px-4 py-3">Caméra</th>
          <th class="px-4 py-3 text-right">Vitesse</th>
          <th class="px-4 py-3 text-right">Limite</th>
          <th class="px-4 py-3">Statut</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-zinc-100 dark:divide-zinc-800/70">
        <template x-if="infractions.length === 0">
          <tr>
            <td colspan="5" class="px-4 py-10 text-center text-zinc-400">
              Aucune infraction pour l'instant.
            </td>
          </tr>
        </template>
        <template x-for="item in infractions" :key="item.id">
          <tr class="transition-colors hover:bg-zinc-50 dark:hover:bg-zinc-800/40" :class="{ 'animate-flash': item._new }">
            <td class="whitespace-nowrap px-4 py-3 font-mono tabular-nums text-zinc-600 dark:text-zinc-400" x-text="formatTime(item.created_at)"></td>
            <td class="px-4 py-3 font-medium" x-text="item.camera_name"></td>
            <td class="px-4 py-3 text-right font-mono tabular-nums" :class="speedClass(item)" x-text="item.recorded_speed_kmh + ' km/h'"></td>
            <td class="px-4 py-3 text-right font-mono tabular-nums text-zinc-500 dark:text-zinc-500" x-text="item.speed_limit_kmh + ' km/h'"></td>
            <td class="px-4 py-3">
              <span
                class="inline-flex items-center rounded-full px-2.5 py-1 text-xs font-mono font-medium uppercase tracking-wide"
                :class="badgeClass(item.status)"
                x-text="statusLabels[item.status] || item.status"
              ></span>
            </td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</div>

{{ infractions_json|json_script:"initial-infractions" }}
<script>
  function infractionsTable() {
    return {
      infractions: JSON.parse(document.getElementById("initial-infractions").textContent),
      wsStatus: "connecting",
      statusLabels: {
        detectee: "Détectée",
        verifiee: "Vérifiée",
        validee: "Validée",
        rejetee: "Rejetée",
      },
      init() {
        this.connect();
      },
      connect() {
        var protocol = window.location.protocol === "https:" ? "wss" : "ws";
        var socket = new WebSocket(protocol + "://" + window.location.host + "/ws/infractions/");
        var self = this;
        socket.addEventListener("open", function () { self.wsStatus = "open"; });
        socket.addEventListener("close", function () { self.wsStatus = "closed"; });
        socket.addEventListener("error", function () { self.wsStatus = "closed"; });
        socket.addEventListener("message", function (event) {
          var infraction = JSON.parse(event.data);
          infraction._new = true;
          self.infractions = [infraction].concat(self.infractions).slice(0, 50);
          setTimeout(function () { infraction._new = false; }, 2000);
        });
      },
      formatTime(iso) {
        var date = new Date(iso);
        return date.toLocaleString("fr-FR", {
          day: "2-digit",
          month: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
        });
      },
      speedClass(item) {
        return Number(item.recorded_speed_kmh) > Number(item.speed_limit_kmh)
          ? "font-semibold text-radar-rose"
          : "text-zinc-700 dark:text-zinc-300";
      },
      badgeClass(status) {
        var map = {
          detectee: "bg-radar-cyan/15 text-radar-cyan",
          verifiee: "bg-radar-amber/15 text-radar-amber",
          validee: "bg-radar-emerald/15 text-radar-emerald",
          rejetee: "bg-zinc-500/15 text-zinc-500 line-through",
        };
        return map[status] || "bg-zinc-500/15 text-zinc-500";
      },
      statusDot() {
        return { connecting: "bg-radar-amber", open: "bg-radar-emerald", closed: "bg-radar-rose" }[this.wsStatus];
      },
      statusClasses() {
        return {
          connecting: "border-radar-amber/40 text-radar-amber",
          open: "border-radar-emerald/40 text-radar-emerald",
          closed: "border-radar-rose/40 text-radar-rose",
        }[this.wsStatus];
      },
      statusLabel() {
        return { connecting: "Connexion…", open: "En direct", closed: "Déconnecté" }[this.wsStatus];
      },
    };
  }
</script>
{% endblock %}
