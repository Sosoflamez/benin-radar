services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: benin_radar
      POSTGRES_USER: benin_radar
      POSTGRES_PASSWORD: benin_radar
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benin_radar"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgres://benin_radar:benin_radar@db:5432/benin_radar
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    # Queue "celery" (défaut) uniquement : tâches courtes (OCR ANPR, purge
    # RGPD). run_camera_stream est routée vers worker-streams (voir
    # CELERY_TASK_ROUTES, config/settings/base.py).
    command: celery -A config worker -l info -Q celery
    volumes:
      - .:/app
    env_file: .env
    environment:
      DATABASE_URL: postgres://benin_radar:benin_radar@db:5432/benin_radar
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-streams:
    build: .
    # Une tâche run_camera_stream par caméra active, sans limite de temps :
    # concurrency dimensionnée sur le nombre de flux RTSP simultanés attendus.
    command: celery -A config worker -l info -Q streams --concurrency=4
    volumes:
      - .:/app
    env_file: .env
    environment:
      DATABASE_URL: postgres://benin_radar:benin_radar@db:5432/benin_radar
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    command: celery -A config beat -l info
    volumes:
      - .:/app
    env_file: .env
    environment:
      DATABASE_URL: postgres://benin_radar:benin_radar@db:5432/benin_radar
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
